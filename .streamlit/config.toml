# Tema base — dark; o visual fino vem do CSS injetado em app/dashboard.py
# (mockup observatorio_barretos: lime #aaff00 + dados matrix-green #00e639).
[theme]
base = "dark"
primaryColor = "#aaff00"
backgroundColor = "#040404"
secondaryBackgroundColor = "#0e0e0e"
textColor = "#cccccc"
font = "monospace"

[server]
headless = true

[browser]
gatherUsageStats = false
